name: 🚀 Build Android APK (一键云端编译生成APK)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5 (自动化环境免安装)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          # 自动定位项目根目录（兼容直接上传或包含外层文件夹的情况）
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            SUBDIR=$(find . -maxdepth 2 ( -name "settings.gradle.kts" -o -name "settings.gradle" ) | head -n 1 | xargs dirname)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "检测到项目位于子目录: $SUBDIR，进入该目录编译..."
              cd "$SUBDIR"
            fi
          fi
          gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK to Artifacts (生成安装包下载)
        uses: actions/upload-artifact@v4
        with:
          name: _______-v1.0.0.apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
