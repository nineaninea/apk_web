name: 🚀 Build Android APK (一键云端编译生成APK)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5 (免本地环境配置)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            gradle assembleDebug --stacktrace --no-daemon
          else
            SETTING_FILE=$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)
            if [ -n "$SETTING_FILE" ]; then
              TARGET_DIR=$(dirname "$SETTING_FILE")
              echo "Moving to project directory: $TARGET_DIR"
              cd "$TARGET_DIR"
            fi
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK to Artifacts (生成安装包下载)
        uses: actions/upload-artifact@v4
        with:
          name: WebDroid-Browser.apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
